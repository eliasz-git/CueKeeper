<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <title>CueKeeper — Sound Cues</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="#cue-list" class="skip-link">Skip to cue list</a>

    <header>
      <div class="brand">
        <h1>CueKeeper</h1>
        <p>Sound cue manager for theater</p>
      </div>

      <div class="toolbar">
        <div id="token-box" class="token-box" role="group" aria-label="Access token">
          <label for="cuekeeper-token">Access token</label>
          <input
            type="password"
            id="cuekeeper-token"
            placeholder="Token (required by server)"
            autocomplete="off"
          />
          <button type="button" id="token-toggle" aria-label="Show/hide token">👁️</button>
          <button type="button" id="token-save">Save</button>
          <p id="token-msg"></p>
        </div>

        <button type="button" id="theme-toggle" aria-label="Toggle dark/light theme">
          Light theme
        </button>

        <div id="ws-status" role="status" aria-live="polite" aria-label="WebSocket connection status">
          <span class="ws-dot"></span>
          <span>Disconnected</span>
        </div>

        <div id="volume-box" class="volume-box" role="group" aria-label="Volume">
          <button type="button" id="mute-btn" aria-label="Mute/unmute audio">🔊</button>
          <input
            type="range"
            id="volume-slider"
            min="0"
            max="100"
            value="100"
            aria-label="Volume"
          />
        </div>

        <div id="timer" role="timer" aria-live="off" aria-label="Playback timer">0:00</div>

        <button type="button" id="go-btn" class="go" aria-label="Play next cue (GO)">
          GO
        </button>
      </div>
    </header>

    <main>
      <section id="upload">
        <h2>Add a cue</h2>
        <form id="upload-form">
          <label for="cue-name">Cue name</label>
          <input
            type="text"
            id="cue-name"
            name="cue-name"
            placeholder="Cue name"
            required
          />
          <label for="cue-file">Audio file</label>
          <input
            type="file"
            id="cue-file"
            name="cue-file"
            accept="audio/*"
            required
          />
          <button type="submit" id="upload-btn">Upload</button>
        </form>
        <p id="upload-msg" role="status" aria-live="polite"></p>
      </section>

      <section id="cues">
        <h2>Cues</h2>
        <div id="cue-list"></div>
        <p id="no-cues" class="hidden">No cues yet. Upload one above.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
